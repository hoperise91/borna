[project]
name = "borna"
version = "0.0.1"
description = "Bornă data pipeline: public Romanian road data -> linear-referenced network"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pdfplumber>=0.11",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "duckdb>=1.1",
  "requests>=2.32",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["borna"]

[tool.ruff]
line-length = 100
target-version = "py312"
